title = "Sanaka 0.0.4 Beta"

notes = """
1、支持指定外部 QEMU 安装目录，也可以扫描电脑中的 QEMU，并显示当前生效路径、版本和来源。
2、重做“连接到 VNC”，增加最近连接、点击重连、按需密码窗口和安全记住密码。
3、重做虚拟机首页、详情页、创建页和设置页，统一界面层级并增加启动、删除和列表排序动画。
4、新增“减弱动态效果”，开启后将大幅位移和缩放动画替换为淡入淡出。
5、改进强调色与深浅主题，支持自定义配色模板，并提高浅色界面的可读性。
6、改进检查更新：清单迁回 Sanaka 仓库，GitHub 访问失败时自动切换代理，并增加五点加载动画。
7、修复编辑虚拟机时切换模板、最近虚拟机排序、新建草稿提前出现等问题。
8、修复 Windows 安装包未完整携带 QEMU 资源，以及 macOS 成品签名损坏导致“应用已损坏”的问题。
"""
